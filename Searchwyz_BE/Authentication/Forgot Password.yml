info:
  name: Forgot Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "john@test.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  const json = res.getBody();\r

        \  if (json.devOtp) bru.setEnvVar('otp', json.devOtp);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
