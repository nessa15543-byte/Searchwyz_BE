info:
  name: Reset Password
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/api/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "resetToken": "{{resetToken}}",
        "newPassword": "newsecret123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
