info:
  name: Refresh Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/auth/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  const json = res.getBody();\r

        \  if (json.data && json.data.accessToken) bru.setEnvVar('accessToken', json.data.accessToken);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
