info:
  name: List My Cases
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/user/cases"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
