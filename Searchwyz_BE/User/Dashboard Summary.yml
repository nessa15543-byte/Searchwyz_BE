info:
  name: Dashboard Summary
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/user/dashboard"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
