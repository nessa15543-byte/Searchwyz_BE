info:
  name: Delete My Case
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/api/user/cases/{{caseId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
